<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Project Shikhara</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/impressum.css">
</head>
<body class="simple-page">

    <header class="simple-header">
        <a href="index.html" class="btn-home">← Home</a>
        <span class="simple-header-title"><span>Shikhara</span> — Contact</span>
    </header>

    <main class="simple-main">
        <div class="simple-card">

            <h1>Get in Touch</h1>
            <p class="form-intro">Have a question, found incorrect temple information, or want to suggest a new temple? We'd love to hear from you.</p>

            <hr class="divider">

            <form class="contact-form" action="https://formspree.io/f/xdarbddd" method="POST">

                <div class="form-group">
                    <label for="reason">Reason for contact</label>
                    <select id="reason" name="reason" required>
                        <option value="" disabled selected>Select a reason</option>
                        <option value="General enquiry">General enquiry</option>
                        <option value="Missing temple information">Missing temple information</option>
                        <option value="Incorrect temple information">Incorrect temple information</option>
                        <option value="New temple suggestion">New temple suggestion</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="name">Your name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Your email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="temple">Temple name (if applicable)</label>
                    <input type="text" id="temple" name="temple" placeholder="e.g. Sri Ganesha Temple Frankfurt">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Please describe your enquiry or the correction needed..." required></textarea>
                </div>

                <button type="submit" class="btn-primary">Send Message</button>

            </form>

            <div class="form-success" id="form-success" style="display:none">
                <p>✅ Thank you! Your message has been sent. We'll get back to you soon.</p>
            </div>

        </div>
    </main>

    <script>
        const form = document.querySelector('.contact-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = new FormData(form);
            const res = await fetch(form.action, {
                method: 'POST',
                body: data,
                headers: { 'Accept': 'application/json' }
            });
            if (res.ok) {
                form.style.display = 'none';
                document.getElementById('form-success').style.display = 'block';
            }
        });
    </script>

</body>
</html>
