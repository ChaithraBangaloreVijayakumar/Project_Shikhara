<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Shikhara — Hindu Temples in Germany</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/explore.css">
</head>
<body>

    <!-- ── Hero ──────────────────────────────────────────────────────────── -->
    <section class="hero parallax">

        <div class="hero-content">

            <p class="hero-eyebrow">Hindu Temples in Germany</p>

            <h1 class="hero-title">
                Find your<br>
                <span>Mandir</span>
            </h1>

            <p class="hero-subtitle">
                A complete, open directory of Hindu temples across Germany —
                from Berlin to Munich, Hamburg to Stuttgart.
            </p>

            <!-- Search box -->
            <div class="hero-search">
                <input type="text" id="search-input" placeholder="Search by temple name, city or state..." />
                <button id="search-btn">Search</button>
            </div>

            <!-- Navigation buttons -->
            <nav class="hero-nav">
                <a href="explore.html" class="hero-nav-btn">
                    <span class="btn-label"><span>Explore all temples</span></span>
                    <span class="btn-icon">→</span>
                </a>
                <a href="by-city.html" class="hero-nav-btn">
                    <span class="btn-label"><span>Browse by city</span></span>
                    <span class="btn-icon">→</span>
                </a>
                <a href="by-state.html" class="hero-nav-btn">
                    <span class="btn-label"><span>Browse by state</span></span>
                    <span class="btn-icon">→</span>
                </a>
            </nav>

        </div>

        <!-- Footer -->
        <footer class="home-footer">
            <span>© 2025 Project Shikhara</span>
            <div>
                <a href="contact.html">Contact</a>
                <a href="impressum.html">Impressum</a>
                <a href="contact.html" class="missing-info-link">Missing or incorrect info?</a>
            </div>
        </footer>

    </section>

    <!-- ── Chatbot bar ────────────────────────────────────────────────────── -->
    <div class="chatbot-bar" style="position:fixed;bottom:0;left:0;right:0;z-index:500;">
        <input type="text" id="chat-input" placeholder="Ask about temples... e.g. Which temples are open on Sundays?" />
        <button id="chat-btn">Ask</button>
    </div>
    <div class="chat-response" id="chat-response" style="display:none;position:fixed;bottom:60px;left:0;right:0;z-index:499;"></div>

    <script src="js/api.js"></script>
    <script src="js/chatbot.js"></script>
    <script>
        const searchBtn   = document.getElementById('search-btn');
        const searchInput = document.getElementById('search-input');

        function doSearch() {
            const q = searchInput.value.trim();
            if (q) {
                sessionStorage.setItem('shikhara_search', q);
                window.location.href = 'explore.html';
            }
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    </script>

</body>
</html>
